[project]
name = "dict-tiny"
version = "2.1.0"
description = "A command-line tool that integrates Youdao Dict and Google Translate."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "louie", email = "louiehan1015@gmail.com"}]
keywords = ["youdao", "dictionary", "command-line", "plumbum", "translator", "translate", "google-translation-api"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "plumbum>=1.10.0",
    "prompt-toolkit>=3.0.52",
    "pyperclip>=1.11.0",
    "requests>=2.32.5",
    "rich>=15.0.0",
]

[project.scripts]
dict-tiny = "dict_tiny.main:run"

[project.urls]
Home = "https://github.com/louieh/dict-tiny"

[tool.setuptools.packages.find]
include = ["dict_tiny*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"