[project]
name = "dict-tiny"
version = "2.0.0"
description = "A command-line tool that integrates Youdao Dict and Google Translate."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "colorama>=0.4.6",
    "lxml>=6.1.0",
    "plumbum>=1.10.0",
    "prompt-toolkit>=3.0.52",
    "pyperclip>=1.11.0",
    "requests>=2.32.5",
    "rich>=15.0.0",
]
